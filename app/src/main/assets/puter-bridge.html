<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Evexia AI connection</title>
    <script
        src="https://js.puter.com/v2/"
        onerror="Evexia.onStatus(false, 'Could not load Puter.js. Check your internet connection and retry.')">
    </script>
</head>
<body>
<script>
    const notifyStatus = async (error = null) => {
        try {
            const signedIn = await puter.auth.isSignedIn();
            Evexia.onStatus(signedIn, error);
        } catch (statusError) {
            Evexia.onStatus(false, statusError?.message || "Couldn't connect to Puter.");
        }
    };

    window.evexiaPuterSignIn = async () => {
        try {
            await puter.auth.signIn();
            await notifyStatus();
        } catch (error) {
            await notifyStatus(error?.message || "Puter sign-in was cancelled.");
        }
    };

    window.evexiaPuterSignOut = async () => {
        try {
            await puter.auth.signOut();
            await notifyStatus();
        } catch (error) {
            await notifyStatus(error?.message || "Couldn't sign out of Puter.");
        }
    };

    window.evexiaPuterChat = async (id, encodedMessages, model, thinkMore) => {
        try {
            const response = await puter.ai.chat(JSON.parse(encodedMessages), {
                model,
                stream: true,
                max_tokens: thinkMore ? 640 : 256,
                ...(thinkMore ? { reasoning_effort: "low" } : {}),
            });
            let answer = "";
            for await (const chunk of response) {
                if (chunk.type === "error") {
                    throw new Error(chunk.message || "Puter AI couldn't complete that request.");
                }
                if (chunk.type === "text" && chunk.text) {
                    answer += chunk.text;
                    Evexia.onProgress(id, answer);
                }
            }
            Evexia.onReply(id, answer, null);
        } catch (error) {
            Evexia.onReply(id, null, error?.message || "Puter AI couldn't complete that request.");
        }
    };

    window.evexiaPuterRefresh = () => notifyStatus();
    if (window.puter) notifyStatus();
</script>
</body>
</html>
